name: ci

on:
  push:
  pull_request:

jobs:
  selftest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: rules_lint
        run: python _tools/scripts/rules_lint.py
      - name: selftest
        run: python _tools/selftest.py
